[package]
name = "glimtray"
version = "0.1.3"
edition = "2024"
description = "Lightweight monitor control for Windows, built with Rust and Slint."
repository = "https://github.com/redpandaex/glimtray"
publish = false

[patch.crates-io]
# Keep the tested dictionary, image and SVG trimming reproducible in local and CI builds.
i-slint-core = { path = "vendor/i-slint-core-1.18.1" }
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit-1.18.1" }
i-slint-renderer-femtovg = { path = "vendor/i-slint-renderer-femtovg-1.18.1" }

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-18", "system-tray", "unstable-winit-030"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1.34"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }
