name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    name: Check and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 40
    outputs:
      prerelease: ${{ steps.release-check.outputs.prerelease }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Verify tag belongs to main and matches Cargo version
        id: release-check
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $release = ./scripts/check-release.ps1 -Tag $env:RELEASE_TAG
          "prerelease=$($release.Prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Test release guard
        run: ./scripts/test-release-guard.ps1

      - name: Check formatting
        run: cargo fmt --package glimtray -- --check

      - name: Verify Slint dictionary trimming
        run: |
          $features = & cargo tree --locked --target x86_64-pc-windows-msvc --edges features --invert parley
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect Slint text dependencies.' }
          if ($features -match 'complex-scripts') { throw 'Slint text dictionaries were re-enabled.' }

      - name: Clippy
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings

      - name: Unit tests
        run: cargo test --locked

      - name: Isolated startup registry test
        run: cargo test --locked --lib startup::tests::registry_round_trip -- --ignored --test-threads=1

      - name: Build release
        run: cargo build --release --locked

      - name: Package compact portable executable
        run: |
          $upxVersion = '5.2.1'
          $upxArchive = Join-Path $env:RUNNER_TEMP "upx-$upxVersion-win64.zip"
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v$upxVersion/upx-$upxVersion-win64.zip" -OutFile $upxArchive
          $expectedHash = 'eabc6792a347d45e945be7748423e7868fd01b0d2bcaa2f4b1031fd71ff69bda'
          if ((Get-FileHash -LiteralPath $upxArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw 'UPX archive checksum mismatch.'
          }
          $upxDirectory = Join-Path $env:RUNNER_TEMP 'glimtray-upx'
          Expand-Archive -LiteralPath $upxArchive -DestinationPath $upxDirectory -Force
          $package = ./scripts/package.ps1 -UpxPath (Join-Path $upxDirectory "upx-$upxVersion-win64/upx.exe")
          Write-Output "$($package.Archive) SHA256: $($package.SHA256)"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish tagged main build
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-${{ github.sha }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes --title "GlimTray ${RELEASE_TAG}")
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*-SHA256SUMS.txt "${args[@]}"
